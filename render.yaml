services:
  - type: web
    name: portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/portfolio/browser
    # Reescribe cualquier ruta a index.html (SPA de Angular)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
