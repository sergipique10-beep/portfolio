<section id="hero" class="hero">
  @defer (when showVisual()) {
    <app-hero-wave></app-hero-wave>
  }
  <div class="hero__noise"></div>
  <div class="hero__lines">
    @for (i of [0,1,2,3,4,5]; track i) {
      <div class="hero__line"></div>
    }
  </div>
  <div class="hero__content">
    <div class="hero__text">
      <span class="hero__label">Full Stack Developer</span>
      <h1 class="hero__name">
        Sergi<br>Piqué<br><span>Garcia</span>
      </h1>
      <div class="hero__actions">
        <button class="btn btn--primary" (click)="scrollTo('projects')">Ver proyectos</button>
        <a class="btn btn--ghost" href="/cv-sergi-pique.pdf" target="_blank" rel="noopener">Descargar CV</a>
        <a class="btn btn--ghost" href="https://github.com/sergipique10-beep" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </div>
</section>
