<section id="skills" class="section section--dark">
  <div class="container">
    <div class="section__head anim">
      <span class="section__num">02</span>
      <h2 class="section__title">Habilidades</h2>
    </div>
    <div class="skills">
      @for (group of skillGroups; track group.label; let i = $index) {
        <div class="skill-group anim anim--scale" [style.transition-delay]="(i * 0.15) + 's'">
          <h3 class="skill-group__label">{{ group.label }}</h3>
          <div class="skill-group__items">
            @for (item of group.items; track item) {
              <span class="skill-tag">
                <app-tech-icon [name]="item"></app-tech-icon>
                <span class="skill-tag__label">{{ item }}</span>
              </span>
            }
            @if (group.label === 'Inteligencia Artificial') {
              <!-- Logo 3D centrado en el hueco a la derecha de los chips de IA. -->
              <div class="skill-group__logo-slot">
                <model-viewer
                  class="skill-group__logo"
                  src="logo.glb"
                  alt="Logo 3D — trabajo asistido por IA"
                  auto-rotate
                  auto-rotate-delay="0"
                  rotation-per-second="35deg"
                  interaction-prompt="none"
                  disable-zoom
                  shadow-intensity="0"
                  exposure="1.1"></model-viewer>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
