<!-- Logo de Devicon o SVG genérico según la tecnología -->
@if (iconClass; as cls) {
  <i class="{{ cls }} tech__logo" aria-hidden="true"></i>
} @else {
  @switch (name) {
    @case ('SQL') {
      <svg class="tech__logo tech__logo--svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <ellipse cx="12" cy="5" rx="8" ry="3"/>
        <path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/>
        <path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/>
      </svg>
    }
    @case ('WebSockets') {
      <svg class="tech__logo tech__logo--svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 8l-4 4 4 4M17 8l4 4-4 4M14 4l-4 16"/>
      </svg>
    }
    @case ('IA') {
      <svg class="tech__logo tech__logo--svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2l1.6 4.6L18 8l-4.4 1.4L12 14l-1.6-4.6L6 8l4.4-1.4z"/>
        <path d="M18 13l.8 2.2L21 16l-2.2.8L18 19l-.8-2.2L15 16l2.2-.8z"/>
      </svg>
    }
    @default {
      <svg class="tech__logo tech__logo--svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 8l-5 4 5 4M15 8l5 4-5 4"/>
      </svg>
    }
  }
}
